name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'requirements.txt'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'requirements.txt'
      - '.github/workflows/backend.yml'

jobs:
  backend-tests:
    name: Run backend test suite
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ci-dummy-secret-not-for-production
      GEMINI_API_KEY: ci-dummy-key
      DATABASE_URL: 'sqlite:///:memory:'
      TWILIO_ACCOUNT_SID: ci-dummy-sid
      TWILIO_AUTH_TOKEN: ci-dummy-token
      TWILIO_PHONE_NUMBER: '+10000000000'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest backend/tests/ -v
