name: rhythma
description: Rhythma - AI-powered multilingual women's health companion for India

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.5

  dio: ^5.4.3+1
  http: ^1.2.2

  flutter_secure_storage: ^9.2.2

  local_auth: ^2.3.0

  provider: ^6.1.2

  google_fonts: ^6.2.1

  go_router: ^13.2.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  firebase_core: ^3.3.0
  cloud_firestore: ^5.2.1
  firebase_auth: ^5.1.3
  firebase_app_check: ^0.3.1+3

  fl_chart: ^0.68.0

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  permission_handler: ^12.0.3

  connectivity_plus: ^6.0.3

  shared_preferences: ^2.3.2

  url_launcher: ^6.3.0
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1

  email_validator: ^3.0.0

  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/avatars/

    - .env
